<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="grablab-page" content="setup">
  <meta name="grablab-site-title" content="{site_title}">
  <title>Initial Admin Setup — {site_title}</title>
  <link rel="stylesheet" href="{tokens_css_url}">
  <link rel="stylesheet" href="{admin_css_url}">
  <link rel="stylesheet" href="/static/admin/admin-ui.css?v=1.5.1">
  <script src="/static/admin/theme-init.js?v=1.5.0"></script>
</head>
<body class="cms-admin-body">
  <main class="cms-auth-shell" data-admin-page="setup">
    <header class="cms-auth-header">
      <a class="cms-brand" href="/">{site_title}</a>
      <span class="cms-badge">First-Run Setup</span>
    </header>
    <section class="cms-auth-card" aria-labelledby="setup-heading">
      <h1 id="setup-heading">Create Primary Administrator</h1>
      <p class="cms-muted">Set up the first admin account. Once created, this setup route locks permanently.</p>
      <section id="setup-form-mount" aria-label="Initial admin setup form"></section>
      <p class="cms-auth-footer"><a href="/">Return to public site</a></p>
    </section>
  </main>
  <script type="module" src="{grex_js_url}"></script>
  <script type="module" src="{admin_js_url}"></script>
</body>
</html>
