<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="grablab-csrf" content="{csrf_token}">
  <meta name="grablab-page" content="{admin_page}">
  <meta name="grablab-role" content="{user_role}">
  <meta name="grablab-user-email" content="{user_email}">
  <meta name="grablab-user-name" content="{user_name}">
  <meta name="grablab-user-id" content="{user_id}">
  <meta name="grablab-site-title" content="{site_title}">
  <meta name="grablab-active-theme" content="{active_theme_slug}">
  <title>{page_title} — {site_title} Admin</title>
  <link rel="stylesheet" href="{tokens_css_url}">
  <link rel="stylesheet" href="{admin_css_url}">
  <link rel="stylesheet" href="/static/admin/admin-ui.css?v=1.5.0">
  <script src="/static/admin/theme-init.js?v=1.5.0"></script>
</head>
<body class="cms-admin-body">
  <a class="cms-skip-link" href="#admin-main">Skip to main content</a>
  <header class="cms-fleetyu-header">
    <section class="cms-topnav-tier" id="admin-nav-mount" aria-label="Admin navigation"></section>
    <section class="cms-utility-tier">
      <section class="cms-utility-inner">
        <section class="cms-topbar-left">
          <button type="button" id="cms-mobile-nav-toggle" class="cms-mobile-nav-btn" aria-controls="admin-nav-mount" aria-expanded="false">Menu</button>
          <a class="cms-brand" href="/admin">{site_title}</a>
        </section>
        <section class="cms-topbar-right" aria-label="Appearance, tools, and account">
          <button type="button" id="cms-search-toggle" class="cms-icon-btn" aria-label="Search admin" aria-haspopup="dialog" aria-expanded="false" aria-controls="cms-search-dialog" title="Search admin"></button>
          <button type="button" id="cms-theme-toggle" class="cms-icon-btn" aria-pressed="true" aria-label="Color theme: dark. Switch to light mode" title="Switch to Light mode"></button>
          <button type="button" id="cms-fullscreen-toggle" class="cms-icon-btn" aria-label="Enter fullscreen" aria-pressed="false" title="Toggle fullscreen"></button>
          <section class="cms-notif-menu-wrap">
            <button type="button" id="cms-notif-btn" class="cms-icon-btn" aria-haspopup="true" aria-expanded="false" aria-controls="cms-notif-dropdown" aria-label="Notifications" title="Notifications"></button>
            <ul id="cms-notif-dropdown" class="cms-notif-dropdown" aria-hidden="true" aria-label="Notifications">
              <li class="cms-notif-head">
                <strong>Notifications</strong>
                <small>Workspace status</small>
              </li>
              <li><a href="/admin/themes" class="cms-topnav-dropdown-link">Active theme: {active_theme_slug}</a></li>
              <li><a href="/admin/profile" class="cms-topnav-dropdown-link">Signed in as {user_name} ({user_role})</a></li>
            </ul>
          </section>
          <section class="cms-avatar-menu-wrap">
            <button type="button" id="cms-avatar-btn" class="cms-avatar-btn" aria-haspopup="true" aria-expanded="false" aria-controls="cms-avatar-dropdown" aria-label="{user_name} ({user_role}) account menu">
              <img src="/static/admin/avatars/avatar-06.png" id="cms-header-avatar-img" alt="" aria-hidden="true" width="36" height="36" class="cms-header-avatar-img">
              <span class="cms-avatar-status" aria-hidden="true"></span>
            </button>
            <ul id="cms-avatar-dropdown" class="cms-avatar-dropdown" aria-hidden="true" aria-label="Account menu">
              <li class="cms-avatar-menu-meta">
                <strong id="cms-avatar-menu-name">{user_name}</strong>
                <small>{user_role} · {active_theme_slug}</small>
              </li>
              <li><a href="/admin/profile" class="cms-topnav-dropdown-link">My Profile</a></li>
              <li><a href="/" class="cms-topnav-dropdown-link">View Site</a></li>
              <li><button type="button" id="admin-logout-btn" class="cms-avatar-signout-btn">Sign Out</button></li>
            </ul>
          </section>
        </section>
      </section>
    </section>
  </header>

  <section id="cms-search-backdrop" class="cms-search-backdrop" hidden>
    <section id="cms-search-dialog" class="cms-search-dialog cms-card" role="dialog" aria-modal="true" aria-labelledby="cms-search-dialog-title">
      <header class="cms-search-dialog-head">
        <strong id="cms-search-dialog-title">Search Admin</strong>
        <button type="button" id="cms-search-close" class="cms-btn-secondary cms-profile-card-action" aria-label="Close search">Close</button>
      </header>
      <input type="search" id="cms-admin-search" placeholder="Search admin sections..." aria-label="Search admin sections" class="cms-search-modal-input">
      <ul id="cms-search-results" class="cms-search-results" aria-label="Search results"></ul>
    </section>
  </section>

  <section class="cms-admin-layout">
    <main class="cms-admin-main" id="admin-main" tabindex="-1" data-admin-page="{admin_page}" data-user-role="{user_role}" data-active-theme="{active_theme_slug}">
      <header class="cms-page-head">
        <section class="cms-page-head-left">
          <h1 id="admin-page-title">{page_title}</h1>
          <p class="cms-muted" id="admin-page-subtitle">{page_subtitle}</p>
        </section>
      </header>
      <section id="admin-app" aria-live="polite"></section>
    </main>
  </section>

  <script type="module" src="{grex_js_url}"></script>
  <script type="module" src="{admin_js_url}"></script>
</body>
</html>
