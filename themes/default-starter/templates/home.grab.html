<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{meta_description}">
  <title>{site_title} — {page_title}</title>
  <link rel="stylesheet" href="{tokens_css_url}">
  <link rel="stylesheet" href="{theme_css_url}">
  <!-- @hook:theme_head_meta -->
</head>
<body>
  <!-- @part:header -->

  <main class="cms-main" data-grex-id="home-main">
    <section class="cms-hero" data-grex-id="home-hero">
      <span class="cms-badge">Theme: {theme_name}</span>
      <h1>{site_title}</h1>
      <p class="cms-meta">{site_tagline}</p>
    </section>

    <section class="cms-card-grid" data-grex-id="home-entries">
      <h2>Published Content ({published_count})</h2>
      <p class="cms-meta">{entries_summary}</p>
      <!-- @part:query_cards -->
      <p class="cms-meta">Sample routes: <a href="/about">/about</a> &middot; <a href="/blog">/blog</a> &middot; <a href="/blog/hello-world">/blog/hello-world</a></p>
    </section>

    <!-- @part:sidebar -->
  </main>

  <!-- @part:footer -->
</body>
</html>
