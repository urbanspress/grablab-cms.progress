<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{meta_description}">
  <title>{site_title} — {page_title}</title>
  <link rel="stylesheet" href="{tokens_css_url}">
  <link rel="stylesheet" href="{theme_css_url}">
</head>
<body>
  <header class="cms-header" data-grex-id="site-header">
    <a class="cms-brand" href="/">{site_title}</a>
    <nav class="cms-nav" aria-label="Primary Navigation">
      <a href="/">Home</a>
      <a href="/about">About</a>
      <a href="/blog">Blog</a>
    </nav>
  </header>

  <main class="cms-main" data-grex-id="home-main">
    <section class="cms-hero" data-grex-id="home-hero">
      <span class="cms-badge">Theme: {theme_name}</span>
      <h1>{site_title}</h1>
      <p class="cms-meta">{site_tagline}</p>
    </section>

    <section class="cms-card" data-grex-id="home-entries">
      <h2>Published Content ({published_count})</h2>
      <p>{entries_summary}</p>
      <p class="cms-meta">Sample routes: <a href="/about">/about</a> &middot; <a href="/blog">/blog</a> &middot; <a href="/blog/hello-world">/blog/hello-world</a></p>
    </section>
  </main>

  <footer class="cms-footer" data-grex-id="site-footer">
    <p>Powered by GrabLab CMS &middot; Active Theme: {theme_slug}</p>
  </footer>
</body>
</html>
