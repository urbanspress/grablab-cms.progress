<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{meta_description}">
  <title>{meta_title} — {site_title}</title>
  <link rel="stylesheet" href="{tokens_css_url}">
  <link rel="stylesheet" href="{theme_css_url}">
</head>
<body>
  <header class="cms-header" data-grex-id="site-header">
    <a class="cms-brand" href="/">{site_title}</a>
    <nav class="cms-nav" aria-label="Primary Navigation">
      <a href="/">Home</a>
      <a href="/about">About</a>
      <a href="/blog">Blog</a>
    </nav>
  </header>

  <main class="cms-main" data-grex-id="single-main">
    <article class="cms-article" data-grex-id="entry-article">
      <span class="cms-badge">{content_type_label}</span>
      <h1>{title}</h1>
      <p class="cms-meta">Path: {full_path} &middot; Published: {published_at}</p>
      <section class="cms-body" data-grex-id="entry-body">
        <p>{body_text}</p>
      </section>
      <section class="cms-meta" data-grex-id="entry-fields">
        <p>Custom Fields: {custom_fields_summary}</p>
      </section>
    </article>
  </main>

  <footer class="cms-footer" data-grex-id="site-footer">
    <p>Powered by GrabLab CMS &middot; Active Theme: {theme_slug}</p>
  </footer>
</body>
</html>
