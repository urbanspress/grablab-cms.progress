<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 Not Found — {site_title}</title>
  <link rel="stylesheet" href="{tokens_css_url}">
  <link rel="stylesheet" href="{theme_css_url}">
  <!-- @hook:theme_head_meta -->
</head>
<body>
  <!-- @part:header -->

  <main class="cms-main" data-grex-id="not-found-main">

      <p><a href="/">Return to homepage</a></p>

  </main>

  <!-- @part:footer -->

</html>
