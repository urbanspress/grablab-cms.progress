<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{meta_description}">
  <title>{archive_label} — {site_title}</title>
  <link rel="stylesheet" href="{tokens_css_url}">
  <link rel="stylesheet" href="{theme_css_url}">
</head>
<body>
  <header class="cms-header" data-grex-id="site-header">
    <a class="cms-brand" href="/">{site_title}</a>
    <nav class="cms-nav" aria-label="Primary Navigation">
      <a href="/">Home</a>
      <a href="/about">About</a>
      <a href="/blog">Blog</a>
    </nav>
  </header>

  <main class="cms-main" data-grex-id="archive-main">
    <section class="cms-hero" data-grex-id="archive-header">
      <span class="cms-badge">Archive</span>
      <h1>{archive_label}</h1>
      <p class="cms-meta">{entry_count} published entries under /{archive_slug}</p>
    </section>

    <section class="cms-card" data-grex-id="archive-list">
      <p>{entries_summary}</p>
    </section>
  </main>

  <footer class="cms-footer" data-grex-id="site-footer">
    <p>Powered by GrabLab CMS &middot; Active Theme: {theme_slug}</p>
  </footer>
</body>
</html>
